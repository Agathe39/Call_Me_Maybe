[project]
name = "Call_Me_Maybe"
version = "0.1.0"
description = "Necessary packages for Call_Me_Maybe project"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "numpy",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "huggingface-hub>=1.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]
